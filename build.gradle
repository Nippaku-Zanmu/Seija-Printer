//file:noinspection JCenterRepository
//file:noinspection GrDeprecatedAPIUsage
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.+'
    id 'maven-publish'
}

//sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21


//archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group


repositories {
//    jcenter()

    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }

    maven { url = "https://www.cursemaven.com" }
    maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
        content {includeGroupAndSubgroups("fi.dy.masa")}
    }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "fallenbreath mixin-auditor"
        url = "https://maven.fallenbreath.me/releases"
    }
    maven { url 'file:///D://hack/SeijaLib' }

    mavenCentral()
}
loom {
    accessWidenerPath = file("src/main/resources/seija-printer.accesswidener")
}
dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings loom.officialMojangMappings()

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"


    //Meteor
//    implementation files('D:\\hack\\SeijaLib\\meteor-client-26.1.2-2.jar')

    implementation "meteordevelopment:meteor-client:${meteor_version}-SNAPSHOT"


    //litematica 1.21
//    modImplementation "com.github.sakura-ryoko:litematica:${project.minecraft_version}-${project.litematica_version}"
//    modImplementation "com.github.sakura-ryoko:malilib:${project.minecraft_version}-${project.malilib_version}"
    implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version_l}:${project.malilib_version}"
    implementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version_l}:${project.litematica_version}"

}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }


}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
//        from("LICENSE") {
//            rename { "${it}_${project.base.archivesBaseName}" }
//        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }
}
//idea警告提示生成的
void plugins(Closure<PluginDependencySpec> pluginDependencySpecClosure) {

}
