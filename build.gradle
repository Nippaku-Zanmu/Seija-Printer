//file:noinspection JCenterRepository
//file:noinspection GrDeprecatedAPIUsage
plugins {

    id "fabric-loom" version "1.14-SNAPSHOT"
    id 'maven-publish'
}

//sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21


//archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group


repositories {
//    jcenter()

    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }


    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://masa.dy.fi/maven" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "fallenbreath mixin-auditor"
        url = "https://maven.fallenbreath.me/releases"
    }
    maven { url 'file:///D://hack/SeijaLib' }

    mavenCentral()
}
loom {
    accessWidenerPath = file("src/main/resources/seija-printer.accesswidener")
}
dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"


    //Meteor(1.21)
//    modImplementation files('D:\\hack\\SeijaLib\\meteor-client-0.6.0-2229.jar')

    modImplementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"


    //litematica 1.21
//    modImplementation "com.github.sakura-ryoko:litematica:${project.minecraft_version}-${project.litematica_version}"
//    modImplementation "com.github.sakura-ryoko:malilib:${project.minecraft_version}-${project.malilib_version}"
    modImplementation("com.github.sakura-ryoko:malilib:${malilib_version}")
    modImplementation("com.github.sakura-ryoko:litematica:${litematica_version}")

}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }


}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
//        from("LICENSE") {
//            rename { "${it}_${project.base.archivesBaseName}" }
//        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}
